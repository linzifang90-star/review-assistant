function bindWiz(){
  const w=wiz;
  const oi=$("#orderInput");
  if(oi) oi.addEventListener("input",()=>{ oi.value=oi.value.replace(/\D/g,"").slice(0,4); w.suffix=oi.value; w.orderErr=""; const e=$("#orderErr"); if(e){e.style.display="none";e.textContent="";} const f=$("#f-order"); if(f)f.classList.remove("invalid"); saveProgress(); });
  const qi=$("#quoteInput");
  if(qi) qi.addEventListener("input",()=>{ w.quote=qi.value; saveProgress(); });
  const di=$("#draftInput");
  if(di) di.addEventListener("input",()=>{
    w.draft=di.value;
    const n=[...w.draft].length, ok=n>0&&n<=120;
    const cc=$("#charCount"); if(cc){ cc.textContent=n+" / 120 字 · 建议 60–120"; cc.classList.toggle("bad",!ok); }
    const nx=document.querySelector('[data-action="wiz-next"]'); if(nx) nx.disabled=!ok;
    saveProgress();
  });
  const cb=$("#confirmBox");
  if(cb) cb.addEventListener("change",()=>{ w.confirmed=cb.checked; $("#confirmRow").classList.toggle("on",cb.checked); const isLow=w.stars>0&&w.stars<=2; const cp=document.querySelector('[data-action="copy-draft"]')||document.querySelector('[data-action="submit-private"]'); const dn=[...w.draft].length; if(cp) cp.disabled=!(cb.checked&&dn>0&&(isLow||dn<=120)); saveProgress(); });
  const cr=$("#confirmRow");
  if(cr) cr.addEventListener("click",e=>{ if(e.target.id!=="confirmBox"){ cb.checked=!cb.checked; cb.dispatchEvent(new Event("change")); } });
  if(w.step===1) startLockTicker();
}
function startLockTicker(){
  if(wizTimer){ clearInterval(wizTimer); wizTimer=null; }
  const tick=()=>{
    if(!wiz||wiz.step!==1){ clearInterval(wizTimer); wizTimer=null; return; }
    const until=(db.locks||{})[wiz.store.id+":"+wiz.suffix]||0;
    const left=Math.ceil((until-Date.now())/1000);
    const b=$("#verifyBtn");
    if(b){ if(left>0){ b.disabled=true; b.textContent=left+"s 后重试"; } else { b.disabled=false; b.textContent="核验"; } }
  };
  tick();
  wizTimer=setInterval(tick,500);
}
function orderError(msg){
  wiz.orderErr=msg;
  const f=$("#f-order"), e=$("#orderErr");
  if(f){ f.classList.add("invalid"); f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake"); }
  if(e){ e.textContent=msg; e.style.display="block"; }
}
function verifyOrder(){
  const w=wiz, s=w.store, now=Date.now();
  const v=w.suffix;
  const lockKey=s.id+":"+v;
  const until=(db.locks||{})[lockKey]||0;
  if(until>now){ orderError("冷却中，请 "+Math.ceil((until-now)/1000)+" 秒后再试"); startLockTicker(); return; }
  if(!/^\d{4}$/.test(v)){ orderError("请输入 4 位数字订单尾号"); return; }
  /* 核验以点击那一刻的最新数据为准，不用打开页面时的旧快照 */
  const freshCheck=readLatestDB();
  if((freshCheck.usage||[]).some(u=>u.storeId===s.id&&u.suffix===v&&u.completed)
     || freshCheck.reviews.some(r=>r.storeId===s.id&&r.orderSuffix===v)){ orderError("该订单已完成评价，一单一评哦"); return; }
  const t0=new Date(); t0.setHours(0,0,0,0);
  const todayCount=(freshCheck.usage||[]).filter(u=>u.storeId===s.id&&u.completed&&u.at>=t0.getTime()).length;
  if(todayCount>=5){ orderError("本店今日评价已达上限（5 条），明天再来吧"); return; }
  if(!(s.orders||[]).includes(v)){
    w.fails++;
    if(w.fails>=3){
      commitDB(d=>{ d.locks=d.locks||{}; d.locks[lockKey]=now+60000; return true; });
      w.fails=0;
      orderError("连续输错 3 次，冷却 60 秒");
      startLockTicker();
    }else orderError("尾号不正确，请核对小票后重试（剩余尝试 "+(3-w.fails)+" 次）");
    return;
  }
  w.fails=0; w.orderErr="";
  commitDB(d=>{
    d.usage=d.usage||[];
    if(!d.usage.some(u=>u.storeId===s.id&&u.suffix===v&&!u.completed)) d.usage.push({storeId:s.id,suffix:v,at:now,completed:false});
    return true;
  });
  w.verified=true; w.step=2; w.maxStep=Math.max(w.maxStep,2);
  markSession("verified");
  renderWiz();
  toast("订单核验通过");
}
function wizNext(){
  const w=wiz;
  if(w.step===1){ verifyOrder(); return; }
  if(w.step===2){
    if(!w.stars){ toast("请先选择星级"); return; }
    const low=w.stars<=2;
    if(!low){
      const needDish=(w.store.dishes||[]).length>0;
      const dishOk=!needDish||w.dishes.size>0;
      const tagOk=[...w.tags].filter(t=>!INTENT_TAGS.includes(t)).length>=2;
      if(!dishOk||!tagOk){
        w.step2Err={dish:!dishOk,tag:!tagOk};
        renderWiz();
        /* 就地提示 + 滚到对应分组即可，不再叠一条内容重复的 toast */
        const el=$("#"+(!dishOk?"hint-dish":"hint-tag"));
        if(el) el.scrollIntoView({behavior:"smooth",block:"center"});
        return;
      }
    }
    w.step2Err=null;
    w.step=3; w.maxStep=Math.max(w.maxStep,3);
    renderWiz();
    syncDraftToInputs();
    return;
  }
  if(w.step===3){
    const n=[...w.draft].length;
    if(n===0||n>120){ toast("草稿不能为空，且不超过 120 字"); return; }
    w.step=4; w.maxStep=Math.max(w.maxStep,4);
    renderWiz();
  }
}
function wizBack(){ if(wiz.step>1){ wiz.step--; renderWiz(); } }
function wizGoto(n){
  if(n>wiz.maxStep||n===wiz.step) return;
  wiz.step=n; renderWiz();
  if(n===3||n===4) syncDraftToInputs();
}
function pickStar(n){
  const w=wiz;
  const oldLow=w.stars>0&&w.stars<=2, newLow=n<=2;
  w.stars=n;

function afterCopy(){
  const w=wiz;
  if(!w.copied){
    const entry={
      id:uid(),storeId:w.store.id,stars:w.stars,tags:[...w.tags],dishes:[...w.dishes],
      quote:w.quote.trim(),text:w.draft,channel:w.stars>=4?"public":"private",
      createdAt:Date.now(),engine:w.engine,tone:w.tone,orderSuffix:w.suffix
    };
    const sid=w.sessionId;
    let occupied=false;
    const ok=commitDB(d=>{
      /* 写入前重查最新占用：其他标签页已提交同一尾号则中止，不产生任何记录 */
      if((d.usage||[]).some(u=>u.storeId===entry.storeId&&u.suffix===entry.orderSuffix&&u.completed)
         || d.reviews.some(r=>r.storeId===entry.storeId&&r.orderSuffix===entry.orderSuffix)){ occupied=true; return false; }
      d.reviews.push(entry);
      const u=(d.usage||[]).find(x=>x.storeId===entry.storeId&&x.suffix===entry.orderSuffix&&!x.completed);
      if(u){ u.completed=true; u.at=Date.now(); }
      const s=d.review_sessions.find(x=>x.id===sid);
      if(s){ const t=Date.now(); if(!s.draftedAt) s.draftedAt=t; if(!s.copiedAt) s.copiedAt=t; if(SESSION_RANK.copied>SESSION_RANK[s.state]) s.state="copied"; s.updatedAt=t; }
      return true;
    });
    if(!ok){ toast(occupied?"该订单已完成评价，一单一评哦":"保存失败，请重试"); return; }
    w.copied=true;
    renderWiz();
    confetti($("#copySuccess"));
    toast("草稿已复制，评价已记录给门店");
  }else{ renderWiz(); toast("草稿已再次复制"); }
}

function confetti(host){
  if(!host) return;
  const colors=["#E0462C","#E0A44B","#26221C"];
  for(let i=0;i<26;i++){
    const c=document.createElement("i");
    c.className="confetti";
    c.style.left=(4+Math.random()*92)+"%";
    c.style.background=colors[i%colors.length];
    c.style.setProperty("--dur",(1.4+Math.random()*1.2)+"s");
    c.style.setProperty("--delay",(Math.random()*.5)+"s");
    c.style.setProperty("--rot",(Math.random()*720-360)+"deg");

    host.appendChild(c);

  }
}

      else toast("复制失败，请手动选择复制");
      break;
    }
    case "copy-public":{
      const ok=await copyText(drawerState.url);
      if(ok) toast("顾客链接已复制，与二维码内容一致");
      else openLinkModal(db.stores.find(x=>x.id===drawerState.storeId),drawerState.url);
      break;
    }
    case "dl-qr":{
      const s=db.stores.find(x=>x.id===drawerState.storeId); if(!s) break;
      downloadCanvas(qrCanvasFor(drawerState.url,1024),`二维码-${s.code}.png`);
      toast("二维码 PNG 已下载（1024×1024，含静区）");
      break;
    }
    case "dl-sticker":{
      const s=db.stores.find(x=>x.id===drawerState.storeId); if(!s) break;
      downloadCanvas(stickerCanvas(s),`桌贴-${s.code}-A6.png`);
      toast("A6 桌贴已下载，可直接打印");
      break;
    }
    case "dl-share":{
      const s=db.stores.find(x=>x.id===drawerState.storeId); if(!s) break;
      downloadCanvas(shareCanvas(s),`分享卡-${s.code}.png`);
      toast("分享卡已下载，可直接发到群里");
      break;
    }
    case "verify-store":{
      const s=db.stores.find(x=>x.id===drawerState.storeId); if(!s) break;
      const w=window.open(storeLink(s.code),"_blank","noopener");
      if(!w) location.href=storeLink(s.code);
      else toast("已在新页打开本店顾客端");
      break;
    }
    case "filter-stars": drawerState.filter=+btn.dataset.n; renderDrawer(); break;
    case "copy-link":{
      const s=db.stores.find(x=>x.id===id); if(!s) break;
      const ok=await copyText(publicUrl(s));
      if(ok) toast("顾客评价链接已复制，去贴在收银台吧");
      else openLinkModal(s,publicUrl(s));
      break;
    }
    case "copy-link-input":{
      const inp=$("#linkInput"); if(!inp) break;
      inp.focus(); inp.select();
      let ok=false; try{ ok=document.execCommand("copy"); }catch(_){}
      if(ok){ closeLayers(); toast("顾客评价链接已复制"); }
      else toast("已选中链接，请按 Ctrl+C 或长按复制");
      break;
    }
    case "open-customer":{
      const s=db.stores.find(x=>x.id===id); if(!s) break;
      location.href=storeLink(s.code);
      break;
    }
    /* ---- 编辑页 ---- */
    case "ed-goto":{
      const sec=btn.dataset.sec;
      ed.activeSec=sec;
      document.querySelectorAll(".ed-nav-chip").forEach(c=>c.classList.toggle("on",c.dataset.sec===sec));
      const el=$("#sec-"+sec);
      if(el) el.scrollIntoView({behavior:"instant",block:"start"});
      break;
    }
    case "editor-back": editorBack(); break;
    case "editor-discard": closeLayers(); ed.dirty=false; renderConsole(); break;
    case "editor-save": editorSave(); break;
    case "qual-demo":{
      const d=ed.draft;
      const name=(d.name.trim()||"演示门店")+"有限公司";
      const uscc=makeUSCC("91330100MA2"+String(Math.floor(Math.random()*9))+"XW8T4".slice(0,6));
      d.quals.licenseName=name;
      d.quals.uscc=uscc;
      if(!d.quals.licenseImg) d.quals.licenseImg=demoLicenseImg(name,uscc);
      if(!d.quals.storeImg) d.quals.storeImg=demoStoreImg(d.name.trim()||"演示门店",(CATS[d.cat]||CATS["餐饮美食"]).hex);
      delete ed.errors["quals.licenseName"]; delete ed.errors["quals.uscc"];
      markDirty(true);
      renderEditor(true);
      toast("演示资质已填入（图片为 canvas 生成样例）");
      break;
    }
    case "img-del":{
      ed.draft.quals[btn.dataset.img]=null;
      markDirty(true); renderEditor(true);
      break;
    }
    case "img-re":{
      const inp=$("#file-"+btn.dataset.img); if(inp) inp.click();
      break;
    }
    case "rev-approve":{
      if(!persistReviewStatus("approved",null)) break;
      toast("审核状态已保存为：通过");
      finishReviewSim();
      break;
    }
    case "rev-reject-open": ed.rejectOpen=true; renderEditor(true); setTimeout(()=>$("#rejectText")?.focus(),60); break;
    case "rev-reject-cancel": ed.rejectOpen=false; renderEditor(true); break;
    case "reject-reason":{
      const ta=$("#rejectText"); if(ta){ ta.value=btn.dataset.r; ta.focus(); }
      break;
    }
    case "rev-reject-confirm":{
      const ta=$("#rejectText");
      const reason=(ta?.value||"").trim();
      if(!reason){ toast("请填写驳回原因"); if(ta){ta.focus(); ta.classList.add("shake"); setTimeout(()=>ta.classList.remove("shake"),450);} return; }
      if(!persistReviewStatus("rejected",reason)) break;
      toast("审核状态已保存为：驳回");
      finishReviewSim();
      break;
    }
    case "dish-add":{
      const n=$("#dName").value, p=$("#dPrice").value, ds=$("#dDesc").value;
      const err=dishValidate(n,p);
      if(err){ ed.errors.dishAdd=err; const el=$("#dishAddErr"); el.textContent=err; el.classList.add("show"); $("#dName").focus(); return; }
      ed.draft.dishes.push({id:uid(),name:n.trim(),price:p===""?null:+p,desc:ds.trim()});
      delete ed.errors.dishes; delete ed.errors.dishAdd;
      markDirty(); renderEditor(true);
      break;
    }
    case "dish-demo":{
      const cat=ed.draft.cat||"餐饮美食";
      const pools={
        "餐饮美食":[["红烧肉",38,"慢炖两小时，肥而不腻"],["酸菜鱼",52,"现杀黑鱼，酸汤开胃"],["时蔬小炒",22,"当日菜场直采"]],
        "咖啡茶饮":[["燕麦拿铁",28,"招牌深烘豆 + 燕麦奶"],["手冲耶加",36,"花香柑橘调"],["海盐可颂",18,"现烤酥皮"]],
        "丽人美业":[["日式建构",168,"含卸甲与护理"],["晕染款式",198,"一对一设计"],["纯色跳色",98,"百款色胶任选"]],
        "休闲娱乐":[["双人畅玩套餐",128,"含设备与饮品"],["主题包间小时",88,"私密沉浸"],["桌游拼场",45,"主持人带玩"]],
        "酒店民宿":[["景观大床房",368,"含双早与延迟退房"],["亲子家庭房",468,"帐篷玩具角"],["山景套房",588,"独立露台"]],
        "零售购物":[["招牌礼盒",88,"门店限定包装"],["会员福袋",59,"随机好物"],["手作周边",39,"设计师联名"]]
      };
      const pool=pools[cat]||pools["餐饮美食"];
      pool.forEach(([name,price,desc])=>{ if(!ed.draft.dishes.some(x=>x.name===name)) ed.draft.dishes.push({id:uid(),name,price,desc}); });
      delete ed.errors.dishes;
      markDirty(); renderEditor(true);
      toast("已填入 3 道示例招牌菜");
      break;
    }
    case "dish-edit": ed.dishEdit=id; delete ed.errors.dishEdit; renderEditor(true); setTimeout(()=>$("#deName")?.focus(),60); break;
    case "dish-edit-cancel": ed.dishEdit=null; delete ed.errors.dishEdit; renderEditor(true); break;
    case "dish-edit-save":{
      const dish=ed.draft.dishes.find(x=>x.id===id); if(!dish) break;
      const n=$("#deName").value, p=$("#dePrice").value, ds=$("#deDesc").value;
      const err=dishValidate(n,p);
      if(err){ ed.errors.dishEdit=err; renderEditor(true); return; }
      dish.name=n.trim(); dish.price=p===""?null:+p; dish.desc=ds.trim();
      ed.dishEdit=null; delete ed.errors.dishEdit;
      markDirty(); renderEditor(true);
      break;
    }
    case "dish-del":{
      const i=ed.draft.dishes.findIndex(x=>x.id===id); if(i<0) break;
      const [removed]=ed.draft.dishes.splice(i,1);
      delete ed.errors.dishes;
      markDirty(); renderEditor(true);
      toast(`已删除「${removed.name}」`,()=>{ ed.draft.dishes.splice(Math.min(i,ed.draft.dishes.length),0,removed); renderEditor(true); });
      break;
    }
    case "tag-add":{
      const g=btn.dataset.g, inp=$("#tagIn-"+g);
      if(tagAdd(g,inp.value)){ inp.value=""; renderEditor(true); setTimeout(()=>$("#tagIn-"+g)?.focus(),40); }
      break;
    }
    case "tag-sugg":{
      const g=btn.dataset.g;
      if(tagAdd(g,btn.dataset.t)) renderEditor(true);
      break;
    }
    case "tag-del":{
      const g=btn.dataset.g, i=+btn.dataset.i;
      const [t]=ed.draft.tags[g].splice(i,1);
      delete ed.errors["tags."+g];
      delete ed.errors.tagsCount;
      markDirty(); renderEditor(true);
      toast(`已删除标签「${t}」`,()=>{ ed.draft.tags[g].splice(Math.min(i,ed.draft.tags[g].length),0,t); renderEditor(true); });
      break;
    }
    case "tag-edit": ed.tagEdit={g:btn.dataset.g,i:+btn.dataset.i}; renderEditor(true); setTimeout(()=>{const x=$("#tagEditIn"); if(x){x.focus();x.select();}},60); break;
    case "tag-edit-cancel": ed.tagEdit=null; renderEditor(true); break;
    case "tag-edit-save":{
      const g=btn.dataset.g, i=+btn.dataset.i, inp=$("#tagEditIn");
      const t=(inp?.value||"").trim();
      const b=bannedIn(t);
      if(!t){ toast("标签不能为空"); return; }
      if(b){ toast(`含${b.kind}词「${b.word}」，请修改`); ed.errors["tags."+g]=`「${t}」含${b.kind}词“${b.word}”`; renderEditor(true); return; }
      if(ed.draft.tags[g].some((x,j)=>j!==i&&x===t)){ toast("标签已存在"); return; }
      ed.draft.tags[g][i]=t;
      ed.tagEdit=null; delete ed.errors["tags."+g];
      markDirty(); renderEditor(true);
      break;
    }
    case "verify-order": verifyOrder(); break;
    case "wiz-step": wizGoto(+btn.dataset.n); break;
    case "wiz-back": wizBack(); break;
    case "wiz-next": wizNext(); break;
    case "pick-star": pickStar(+btn.dataset.n); break;
    case "pick-dish":{
      if(!wiz) break;
      const t=btn.dataset.t;
      wiz.dishes.has(t)?wiz.dishes.delete(t):wiz.dishes.add(t);
      btn.classList.toggle("on");
      if(wiz.step2Err&&wiz.step2Err.dish&&wiz.dishes.size>0){ wiz.step2Err.dish=false; const h=$("#hint-dish"); if(h)h.classList.remove("show"); }
      break;
    }
    case "pick-tag":{
      if(!wiz) break;
      const t=btn.dataset.t;
      wiz.tags.has(t)?wiz.tags.delete(t):wiz.tags.add(t);
      btn.classList.toggle("on");
      if(wiz.step2Err&&wiz.step2Err.tag&&wiz.tags.size>=2){ wiz.step2Err.tag=false; const h=$("#hint-tag"); if(h)h.classList.remove("show"); }
      break;
    }
    case "tone-set":{
      if(!wiz||wiz.generating) break;
      wiz.tone=btn.dataset.t;
      renderWiz();
      generateDraft();
      break;
    }
    case "regen":{
      if(!wiz||wiz.generating) break;
      wiz.seed++;
      generateDraft();
      break;
    }
    case "use-local":{
      if(!wiz||wiz.generating) break;
      wiz.forceLocal=true; wiz.genError="";
      generateDraft();
      break;
    }
    case "use-model":{
      if(!wiz||wiz.generating) break;
      wiz.forceLocal=false; wiz.genError="";
      generateDraft();
      break;
    }
    case "submit-private":{
      if(!wiz) break;
      const w=wiz;
      if(!(w.stars>0&&w.stars<=2)) break;
      if(w.copied){ renderWiz(); toast("私密反馈已提交，仅门店负责人可见"); break; }
      if(!w.confirmed){ toast("请先勾选确认"); break; }
      if([...w.draft].length===0){ toast("反馈内容不能为空"); break; }
      const entry={
        id:uid(),storeId:w.store.id,stars:w.stars,tags:[...w.tags],dishes:[...w.dishes],
        quote:w.quote.trim(),text:w.draft,channel:"private",
        createdAt:Date.now(),engine:w.engine,tone:w.tone,orderSuffix:w.suffix
      };
      const sid=w.sessionId;
      let occupied=false;
      const ok=commitDB(d=>{
        /* 写入前重查最新占用：其他标签页已提交同一尾号则中止，不产生任何记录 */
        if((d.usage||[]).some(u=>u.storeId===entry.storeId&&u.suffix===entry.orderSuffix&&u.completed)
           || d.reviews.some(r=>r.storeId===entry.storeId&&r.orderSuffix===entry.orderSuffix)){ occupied=true; return false; }
        d.reviews.push(entry);
        const u=(d.usage||[]).find(x=>x.storeId===entry.storeId&&x.suffix===entry.orderSuffix&&!x.completed);
        if(u){ u.completed=true; u.at=Date.now(); }
        const s=d.review_sessions.find(x=>x.id===sid);
        if(s){ const t=Date.now(); if(!s.privateAt) s.privateAt=t; if(SESSION_RANK.private>SESSION_RANK[s.state]) s.state="private"; s.updatedAt=t; }
        return true;
      });
      if(!ok){ toast(occupied?"该订单已完成评价，一单一评哦":"保存失败，请重试"); break; }
      w.copied=true;
      renderWiz();
      toast("私密反馈已提交，仅门店负责人可见");
      break;
    }
    case "copy-draft":{
      if(!wiz) break;
      const n=[...wiz.draft].length;
      if(!wiz.confirmed){ toast("请先勾选真实性确认"); break; }
      if(n===0||n>120){ toast("草稿不能为空，且不超过 120 字"); break; }
      const ok=await copyText(wiz.draft);
      if(ok) afterCopy();
      else openDraftModal();
      break;
    }
    case "copy-draft-modal":{
      const t=$("#draftModalText");
      let ok=false;
      if(t){ t.focus(); t.select(); try{ ok=document.execCommand("copy"); }catch(_){} }
      if(ok){ const ls=document.querySelectorAll("[data-layer]"); if(ls.length) ls[ls.length-1].remove(); afterCopy(); }
      else toast("复制失败，请手动 Ctrl+C");
      break;
    }
    case "open-platform":{
      if(!wiz) break;
      const lk=(wiz.store.links&&wiz.store.links[btn.dataset.k]||"").trim();
      if(!/^https:\/\/\S+\.\S+/.test(lk)){ e.preventDefault(); toast("该平台尚未配置链接，无法跳转"); break; }
      saveProgress();
      toast("已在新页面打开平台门店页，本页步骤与草稿已保留");
      break;
    }
    case "progress-keep":{ if(wiz){ wiz.resume=null; renderWiz(); } break; }
    case "progress-restart":{
      if(!wiz) break;
      const restartUrl=storeLink(wiz.store.code);
      clearProgress(wiz.store.code);
      try{ localStorage.setItem(restartMarkerKey(wiz.store.code),JSON.stringify({sid:wiz.sessionId,at:Date.now()})); }catch(e){}
      wiz=null;
      location.href=restartUrl;
      break;
    }
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ toggleTbMenu(false); closeLayers(); }
  if(e.key==="Enter"){
    if(e.target.id==="loginPhone") sendCode();
    if(e.target.id==="loginCode") doLogin();
    if(editorActive&&e.target.id&&e.target.id.startsWith("tagIn-")){
      e.preventDefault();
      const g=e.target.id.slice(6);
      if(tagAdd(g,e.target.value)){ e.target.value=""; renderEditor(true); setTimeout(()=>$("#tagIn-"+g)?.focus(),40); }
    }
    if(editorActive&&e.target.id==="tagEditIn"){ e.preventDefault(); const b=$("[data-action='tag-edit-save']"); if(b) b.click(); }
    if(editorActive&&e.target.id==="dName"){ e.preventDefault(); const b=$("[data-action='dish-add']"); if(b) b.click(); }
  }
});
window.addEventListener("popstate",route);
document.addEventListener("keydown",e=>{
  const b=document.activeElement;
  if(!b||!b.classList||!b.classList.contains("big-star"))return;
  const dir=e.key==="ArrowRight"||e.key==="ArrowUp"?1:e.key==="ArrowLeft"||e.key==="ArrowDown"?-1:0;
  if(!dir)return;
  e.preventDefault();
  const n=Math.min(5,Math.max(1,(+b.dataset.n||1)+dir));
  pickStar(n);
  requestAnimationFrame(()=>{const t=document.querySelector('.big-star[data-n="'+n+'"]');if(t)t.focus();});
});
route();
</script>
</body>
</html>
